name: Deploy Pages

on:
  push:
    branches: [main]

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      # 《十年，慢慢走》：獨立的 Vite 專案，建置後放到站台的 slow-walk/ 子路徑。
      - name: Build slow-walk
        run: |
          diff slow-walk/content/content.js src/content.js
          npm ci --prefix slow-walk
          npm test --prefix slow-walk
          npm run build --prefix slow-walk
          npm run check --prefix slow-walk
          cp -R slow-walk/dist dist/slow-walk
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
