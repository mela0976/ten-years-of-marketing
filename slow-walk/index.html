<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#27343b" />
    <meta name="description" content="一段從台北出發、慢慢走回家的十年旅程。" />
    <title>十年，慢慢走</title>
    <!-- 子路徑預覽也沿用本站主角貼圖作為分頁圖示。 -->
    <link rel="icon" href="./art/common/hero-head.webp" type="image/webp" />
  </head>
  <body>
    <main id="app" aria-label="十年，慢慢走">
      <section id="title-screen" class="title-screen" aria-labelledby="title-heading">
        <p class="eyebrow">2018 — 2027</p>
        <h1 id="title-heading">十年，慢慢走</h1>
        <p id="intro-text" class="intro-text"></p>
        <button id="start-button" class="primary-button" type="button">開始旅程</button>
      </section>

      <section id="game-screen" class="game-screen" hidden aria-label="旅程畫面">
        <div class="stage-column">
          <div id="stage-frame" class="stage-frame">
            <div id="stage-fallback" class="stage-fallback" aria-hidden="true"></div>
            <div id="stage-host" class="stage-host" aria-hidden="true"></div>
            <header class="stage-header">
              <div class="chapter-label">
                <span id="chapter-year" class="chapter-year"></span>
                <h1 id="chapter-title"></h1>
              </div>
              <nav id="progress" class="progress" aria-label="旅程進度"></nav>
              <div class="stage-controls">
                <button id="auto-button" class="icon-button" type="button" aria-pressed="false">自動走</button>
                <button id="mute-button" class="icon-button" type="button" aria-pressed="false">聲音</button>
                <button id="menu-button" class="icon-button" type="button">選單</button>
              </div>
            </header>
            <button id="world-prompt" class="world-prompt" type="button" hidden></button>
          </div>
          <p id="scene-caption" class="scene-caption" aria-live="polite"></p>
        </div>

        <section id="story-panel" class="story-panel" aria-live="polite">
          <div id="story-content" class="story-content"></div>
          <p id="hint" class="hint"></p>
          <!-- 走路改由整個遊戲畫面接收按住操作，提示由 guide 模組建立。 -->
        </section>
      </section>

      <dialog id="chapter-menu" class="chapter-menu" aria-labelledby="menu-heading">
        <div class="dialog-head">
          <h2 id="menu-heading">旅程選單</h2>
          <button id="close-menu" class="icon-button" type="button">關閉</button>
        </div>
        <nav id="chapter-list" class="chapter-list" aria-label="可重玩的章節"></nav>
      </dialog>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
